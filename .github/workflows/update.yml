# 30분마다 네이버 블로그에서 이웃 수, 방문자, 최근 글을 새로 가져와
# data/blog.json 과 index.html 을 갱신하고 GitHub Pages에 다시 올립니다.
name: 블로그 숫자 갱신과 배포

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 네이버 블로그 숫자 가져오기
        id: fetch
        continue-on-error: true
        run: node server.mjs --once

      - name: 바뀐 숫자 저장
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/blog.json index.html
          if git diff --cached --quiet; then
            echo "바뀐 숫자 없음"
          else
            git commit -m "블로그 숫자 갱신"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
