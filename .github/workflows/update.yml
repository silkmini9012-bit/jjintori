# 10분마다 네이버 블로그에서 이웃 수, 방문자, 최근 글을 새로 가져와
# 페이지에 반영한 뒤 GitHub Pages에 다시 올립니다. (저장소에 커밋은 남기지 않습니다)
# 정각/30분은 GitHub 예약 실행이 몰려 자주 빠지므로 3분, 13분, 23분…에 돌립니다.
name: 블로그 숫자 갱신과 배포

on:
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 네이버 블로그 숫자 가져오기
        id: fetch
        continue-on-error: true
        run: node server.mjs --once

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
